# Docker Compose 설정 파일
# 위치: ~/MTD/MTD_full_testbed/docker-compose-mtd.yml
# 
# 통합 MTD 테스트베드를 위한 완전한 Docker 환경
# 기존 DVD 시뮬레이터와 호환되며 NS-3, Gazebo, QGroundControl 통합

version: '3.8'

services:
  # ===========================================
  # 핵심 드론 시뮬레이션 환경
  # ===========================================
  
  # ArduPilot SITL 컨테이너
  ardupilot-sitl:
    build:
      context: ./docker/ardupilot
      dockerfile: Dockerfile
    container_name: mtd-ardupilot-sitl
    networks:
      - drone-simulation-net
      - fanet-network
    ports:
      - "14550:14550/udp"  # MAVLink
      - "14551:14551/udp"  # MAVLink GCS
      - "5760:5760/tcp"    # Serial connection
    volumes:
      - ./configs/ardupilot:/configs:ro
      - ./logs/ardupilot:/logs
      - ./missions:/missions:ro
    environment:
      - SITL_VEHICLE=copter
      - SITL_LOCATION=KSFO
      - SITL_INSTANCE=0
      - SITL_SPEEDUP=1
    command: >
      bash -c "
        cd /ardupilot &&
        python Tools/autotest/sim_vehicle.py
        --vehicle=copter
        --location=KSFO
        --instance=0
        --out=0.0.0.0:14550
        --out=0.0.0.0:14551
        --console
        --map
      "
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "14550"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Gazebo 시뮬레이터
  gazebo-simulator:
    build:
      context: ./docker/gazebo
      dockerfile: Dockerfile
    container_name: mtd-gazebo-sim
    networks:
      - drone-simulation-net
    ports:
      - "11345:11345"  # Gazebo master port
      - "8080:8080"    # Gzweb interface
    volumes:
      - ./gazebo/worlds:/gazebo/worlds:ro
      - ./gazebo/models:/gazebo/models:ro
      - ./logs/gazebo:/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - GAZEBO_WORLD_FILE=/gazebo/worlds/fanet_world.world
      - GAZEBO_MODEL_PATH=/gazebo/models
    command: >
      bash -c "
        source /opt/ros/noetic/setup.bash &&
        source /gazebo/setup.bash &&
        gazebo --verbose /gazebo/worlds/fanet_world.world
      "
    depends_on:
      - ardupilot-sitl
    restart: unless-stopped

  # ===========================================
  # NS-3 FANET 네트워크 시뮬레이터
  # ===========================================
  
  ns3-fanet-simulator:
    build:
      context: ./docker/ns3
      dockerfile: Dockerfile
    container_name: mtd-ns3-fanet
    networks:
      - fanet-network
      - monitoring-net
    volumes:
      - ./ns-3.45:/ns3:rw
      - ./logs/ns3:/ns3/results
      - ./configs/ns3:/ns3/configs:ro
    environment:
      - NS3_FANET_NODES=20
      - NS3_SIMULATION_TIME=300
      - NS3_COMMUNICATION_RANGE=250
      - NS3_MOBILITY_MODEL=RandomWalk2dMobilityModel
    command: >
      bash -c "
        cd /ns3 &&
        ./ns3 configure --enable-examples --enable-tests &&
        ./ns3 build &&
        ./ns3 run fanet-mtd-simulation --
        --nNodes=20
        --simTime=300.0
        --range=250.0
        --outputDir=/ns3/results
      "
    depends_on:
      - ardupilot-sitl
    restart: unless-stopped

  # ===========================================
  # 보안 모니터링 및 CTI 수집
  # ===========================================
  
  # Falco 보안 모니터링
  falco-security:
    image: falcosecurity/falco:latest
    container_name: mtd-falco-monitor
    privileged: true
    networks:
      - monitoring-net
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /dev:/host/dev:ro
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
      - /etc:/host/etc:ro
      - ./configs/falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./configs/falco/drone-rules.yaml:/etc/falco/drone-rules.yaml:ro
      - ./logs/falco:/var/log/falco
    environment:
      - FALCO_GRPC_ENABLED=true
      - FALCO_GRPC_BIND_ADDRESS=0.0.0.0:5060
    command: >
      falco 
        --config /etc/falco/falco.yaml
        --rules /etc/falco/drone-rules.yaml
        --cri /run/containerd/containerd.sock
    restart: unless-stopped

  # ELK Stack - Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: mtd-elasticsearch
    networks:
      - monitoring-net
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./logs/elasticsearch:/usr/share/elasticsearch/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ELK Stack - Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: mtd-kibana
    networks:
      - monitoring-net
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    volumes:
      - ./configs/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Fluentd 로그 수집기
  fluentd:
    build:
      context: ./docker/fluentd
      dockerfile: Dockerfile
    container_name: mtd-fluentd
    networks:
      - monitoring-net
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./configs/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./logs/fluentd:/var/log/fluentd
    environment:
      - FLUENTD_CONF=fluent.conf
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # ===========================================
  # MTD 방어 시스템
  # ===========================================
  
  mtd-orchestrator:
    build:
      context: ./docker/mtd
      dockerfile: Dockerfile
    container_name: mtd-orchestrator
    networks:
      - drone-simulation-net
      - fanet-network
      - monitoring-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./configs/mtd:/configs:ro
      - ./logs/mtd:/logs
      - ./results:/results:rw
    environment:
      - MTD_MUTATION_CYCLE=60
      - MTD_THREAT_THRESHOLD=0.5
      - MTD_DOCKER_API=unix:///var/run/docker.sock
    command: >
      python3 /app/mtd_orchestrator.py
        --config /configs/mtd_config.json
        --log-level INFO
    depends_on:
      - elasticsearch
      - falco-security
    restart: unless-stopped

  # ===========================================
  # 통합 CTI 분석 시스템
  # ===========================================
  
  cti-analyzer:
    build:
      context: ./docker/cti
      dockerfile: Dockerfile
    container_name: mtd-cti-analyzer
    networks:
      - monitoring-net
      - fanet-network
    ports:
      - "8090:8090"  # CTI API 서버
    volumes:
      - ./configs/cti:/configs:ro
      - ./logs/cti:/logs
      - ./results:/results:rw
      - ./models:/models:ro  # 기계학습 모델
    environment:
      - CTI_MODEL_PATH=/models
      - CTI_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CTI_API_PORT=8090
    command: >
      python3 /app/enhanced_cti_system.py
        --config /configs/cti_config.json
        --model-path /models
        --api-port 8090
    depends_on:
      - elasticsearch
      - fluentd
    restart: unless-stopped

  # ===========================================
  # DVD 호환성 계층
  # ===========================================
  
  # DVD 컴패니언 컴퓨터 (기존 DVD와 호환)
  dvd-companion:
    build:
      context: ./Damn-Vulnerable-Drone/companion-computer
      dockerfile: Dockerfile
    container_name: mtd-dvd-companion
    networks:
      drone-simulation-net:
        ipv4_address: 10.13.0.3
      wireless-net:
        ipv4_address: 192.168.13.1
    ports:
      - "80:80"        # HTTP 인터페이스
      - "22:2222"      # SSH (포트 변경)
      - "554:554"      # RTSP 스트림
    volumes:
      - ./logs/dvd-companion:/logs
      - ./configs/dvd:/configs:ro
    environment:
      - DVD_ENVIRONMENT=SIMULATION
      - MAVLINK_ENDPOINT=ardupilot-sitl:14550
    depends_on:
      - ardupilot-sitl
    restart: unless-stopped

  # DVD 공격 실행기
  dvd-attack-runner:
    build:
      context: ./docker/dvd-attacks
      dockerfile: Dockerfile
    container_name: mtd-dvd-attacks
    networks:
      - drone-simulation-net
      - wireless-net
      - monitoring-net
    volumes:
      - ./dvd_lite:/app/dvd_lite:ro
      - ./logs/attacks:/logs
      - ./results:/results:rw
      - ./configs/attacks:/configs:ro
    environment:
      - DVD_TARGET_HOST=dvd-companion
      - DVD_SIMULATION_MODE=true
      - ATTACK_INTERVAL=60
    command: >
      python3 /app/automated_attack_runner.py
        --config /configs/attack_config.json
        --target dvd-companion
        --interval 60
    depends_on:
      - dvd-companion
      - cti-analyzer
    restart: unless-stopped

  # ===========================================
  # 지상 관제소 (QGroundControl 호환)
  # ===========================================
  
  qgroundcontrol-sim:
    build:
      context: ./docker/qgc
      dockerfile: Dockerfile
    container_name: mtd-qgc-sim
    networks:
      - drone-simulation-net
    ports:
      - "5900:5900"  # VNC 접근
    volumes:
      - ./configs/qgc:/configs:ro
      - ./missions:/missions:rw
      - ./logs/qgc:/logs
    environment:
      - DISPLAY=:1
      - VNC_PASSWORD=mtdtest
      - MAVLINK_CONNECTION=udp://ardupilot-sitl:14551
    command: >
      bash -c "
        vncserver :1 -geometry 1024x768 -depth 24 &&
        DISPLAY=:1 /QGroundControl.AppImage
      "
    depends_on:
      - ardupilot-sitl
    restart: unless-stopped

  # ===========================================
  # 모니터링 및 대시보드
  # ===========================================
  
  # Grafana 대시보드
  grafana:
    image: grafana/grafana:latest
    container_name: mtd-grafana
    networks:
      - monitoring-net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mtdadmin
      - GF_INSTALL_PLUGINS=grafana-elasticsearch-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Prometheus 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: mtd-prometheus
    networks:
      - monitoring-net
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # cAdvisor 컨테이너 모니터링
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: mtd-cadvisor
    networks:
      - monitoring-net
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped

  # ===========================================
  # 네트워크 분석 도구
  # ===========================================
  
  # Zeek 네트워크 분석
  zeek-analyzer:
    build:
      context: ./docker/zeek
      dockerfile: Dockerfile
    container_name: mtd-zeek
    networks:
      - monitoring-net
      - fanet-network
    volumes:
      - ./configs/zeek:/opt/zeek/etc:ro
      - ./logs/zeek:/opt/zeek/logs
      - ./zeek-scripts:/opt/zeek/share/zeek/policy/custom:ro
    environment:
      - ZEEK_INTERFACE=eth0
      - ZEEK_NODE_CFG=/opt/zeek/etc/node.cfg
    command: >
      bash -c "
        /opt/zeek/bin/zeekctl deploy &&
        tail -f /opt/zeek/logs/current/*.log
      "
    restart: unless-stopped

  # Suricata IDS
  suricata-ids:
    image: jasonish/suricata:latest
    container_name: mtd-suricata
    networks:
      - monitoring-net
      - fanet-network
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/suricata/rules:/var/lib/suricata/rules:ro
      - ./logs/suricata:/var/log/suricata
    environment:
      - SURICATA_INTERFACE=eth0
    command: >
      suricata -c /etc/suricata/suricata.yaml -i eth0 -v
    restart: unless-stopped

  # ===========================================
  # 외부 CTI 플랫폼 연동
  # ===========================================
  
  # MISP 플랫폼 (경량화 버전)
  misp-platform:
    image: coolacid/misp-docker:core-latest
    container_name: mtd-misp
    networks:
      - monitoring-net
    ports:
      - "8443:443"
      - "8080:80"
    environment:
      - MYSQL_ROOT_PASSWORD=misptest
      - MYSQL_MISP_PASSWORD=misptest
      - MISP_ADMIN_EMAIL=admin@mtd-testbed.local
      - MISP_ADMIN_PASSPHRASE=admin
      - MISP_BASEURL=https://localhost:8443
    volumes:
      - misp-data:/var/www/MISP
      - ./configs/misp:/etc/misp:ro
    restart: unless-stopped

# ===========================================
# 네트워크 정의
# ===========================================

networks:
  # 드론 시뮬레이션 네트워크 (기존 DVD와 호환)
  drone-simulation-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.13.0.0/24
          gateway: 10.13.0.1
    driver_opts:
      com.docker.network.bridge.name: "dvd-sim-br"

  # 무선 네트워크 시뮬레이션 (기존 DVD와 호환)
  wireless-net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.13.0/24
          gateway: 192.168.13.1
    driver_opts:
      com.docker.network.bridge.name: "dvd-wifi-br"

  # FANET 네트워크
  fanet-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: "fanet-br"

  # 모니터링 네트워크
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
    driver_opts:
      com.docker.network.bridge.name: "monitor-br"

# ===========================================
# 볼륨 정의
# ===========================================

volumes:
  elasticsearch-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  misp-data:
    driver: local

# ===========================================
# 확장 설정 (선택적 프로파일)
# ===========================================

# 개발 모드 프로파일
x-development-services:
  jupyter-notebook:
    profiles: ["development"]
    image: jupyter/scipy-notebook:latest
    container_name: mtd-jupyter
    networks:
      - monitoring-net
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./results:/home/jovyan/results
      - ./models:/home/jovyan/models
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=mtdtoken
    restart: unless-stopped

  # 디버깅용 컨테이너
  debug-container:
    profiles: ["debug"]
    image: nicolaka/netshoot
    container_name: mtd-debug
    networks:
      - drone-simulation-net
      - fanet-network
      - monitoring-net
    volumes:
      - ./logs:/logs:ro
      - ./configs:/configs:ro
    command: sleep infinity
    restart: unless-stopped

# 프로덕션 모드 프로파일
x-production-services:
  # 고가용성 Elasticsearch 클러스터
  elasticsearch-node2:
    profiles: ["production"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: mtd-elasticsearch-node2
    networks:
      - monitoring-net
    environment:
      - cluster.name=mtd-cluster
      - node.name=es-node2
      - discovery.seed_hosts=elasticsearch
      - cluster.initial_master_nodes=elasticsearch,elasticsearch-node2
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - elasticsearch-node2-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  elasticsearch-node2-data:
    profiles: ["production"]