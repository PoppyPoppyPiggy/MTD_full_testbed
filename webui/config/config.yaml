webui:
  host: '0.0.0.0'
  port: 5000
  debug: false
  secret_key: 'mtd-drone-security-testbed'

database:
  path: '../attack_output/unified_metrics.db'
  
backend_services:
  data_collection_interval: 5
  max_data_points: 1000
  
frontend:
  refresh_interval: 5000
  chart_animation: true
  dark_mode: false

experiment:
  default_duration: 300
  max_duration: 3600
  auto_analysis: true

logging:
  level: 'INFO'
  file: '../webui/logs/webui.log'
