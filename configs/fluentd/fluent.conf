# Fluentd 설정 파일
# 위치: ~/MTD/MTD_full_testbed/configs/fluentd/fluent.conf

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# MAVLink 로그 파싱
<filter dvd.ardupilot>
  @type parser
  format json
  key_name log
  reserve_data true
  <parse>
    @type regexp
    expression /^MAV: (?<msg_type>\w+) SYS:(?<sys_id>\d+) COMP:(?<comp_id>\d+) LEN:(?<length>\d+) MSG ID:(?<msg_id>\d+)/
  </parse>
</filter>

# NS-3 시뮬레이션 로그 파싱
<filter fanet.ns3>
  @type parser
  format json
  key_name log
  <parse>
    @type regexp
    expression /^(?<timestamp>\d+\.\d+)s.*Node (?<node_id>\d+).*(?<event_type>\w+)/
  </parse>
</filter>

# 보안 이벤트 필터링
<filter **>
  @type grep
  <regexp>
    key message
    pattern /(ATTACK|ANOMALY|INTRUSION|SPOOFING|JAMMING|MTD)/
  </regexp>
</filter>

# Elasticsearch로 전송
<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix mtd-testbed
  <buffer>
    @type memory
    flush_interval 1s
  </buffer>
</match>
