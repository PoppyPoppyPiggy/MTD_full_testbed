# MTD 통합 정책 v22.1 - GPU 튜닝 반영
game_theory_env:
  attack_surface_ips:
    - "10.13.0.3"
    - "10.13.0.100"
    - "10.13.0.101"
    - "10.13.0.102"
    - "10.13.0.103"
    - "10.13.0.104"
  max_decoys: 2
  scan_success_probability: 0.8

rl:
  mtd_model_name: "mtd_agent_v5_icm.zip"
  seeker_model_name: "seeker_agent_v5_icm.zip"

  training:
    total_timesteps: 1_000_000
    update_timestep: 8192
    ppo_epochs: 6
    learning_rate: 0.0003

  reward_weights:
    mtd_breach_penalty: -200.0
    mtd_deception_reward: 75.0
    mtd_uncertainty_reward: 10.0
    mtd_defense_success_reward: 5.0
    mtd_action_cost: -2.0

    seeker_hit_reward: 150.0
    seeker_decoy_penalty: -100.0
    seeker_miss_penalty: -10.0
    seeker_action_cost: -1.0
    seeker_scan_reveal_reward: 10.0
    seeker_blocked_penalty: -20.0

  icm:
    enable: true
    intrinsic_reward_weight: 0.01
    icm_learning_rate: 0.0003
