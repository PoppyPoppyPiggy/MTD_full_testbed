# W&B Sweep Configuration for MTD-RL v08
# 사용법:
#   1. wandb sweep sweep_config.yaml
#   2. wandb agent <SWEEP_ID>

program: rl_train_v08.py
method: bayes
metric:
  name: best_reward
  goal: maximize

parameters:
  hidden_size:
    values: [128, 256, 512]
  
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.001
  
  batch_size:
    values: [32, 64, 128]
  
  gamma:
    distribution: uniform
    min: 0.95
    max: 0.999
  
  gae_lambda:
    distribution: uniform
    min: 0.9
    max: 0.99
  
  clip_epsilon:
    distribution: uniform
    min: 0.1
    max: 0.3
  
  entropy_coef_start:
    distribution: uniform
    min: 0.01
    max: 0.05

command:
  - ${env}
  - python
  - ${program}
  - --curriculum
  - --episodes=300
  - --wandb
  - --wandb-project=mtd-rl-sweep
  - ${args}
