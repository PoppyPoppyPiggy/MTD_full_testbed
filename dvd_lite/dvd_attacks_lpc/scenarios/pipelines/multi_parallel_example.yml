scenario: multi-parallel
desc: 병렬 공격 예시(STATUS_TEXT 노이즈 + GPS 표류) → 중간에 MTD 후 평가
defaults:
  role: gcs
  svc: mavlink
  atk_level: medium
  sim_time: 40
  mtd: off
  udp_probe: { count: 60, interval: 0.02 }

steps:
  - pcap_start: {}
  - udp_probe: {}

  # 병렬: 주입 + GPS
  - parallel:
      - attack: { name: mavlink_statustext_noise, level: high, duration_s: 18, pps: 60 }
      - attack: { name: gps_slow_spoof,        level: medium, duration_s: 28 }

  - mtd_apply: { loss_pct: 1.0, delay_ms: 2, jitter_ms: 1, dup_pct: 0.0 }
  - sleep: { sec: 2 }

  # 병렬 한 번 더(짧게)
  - parallel:
      - attack: { name: mavlink_param_poll, level: low, duration_s: 10 }
      - udp_probe: { count: 30, interval: 0.02 }

  - mtd_revert: {}
  - pcap_stop: {}

  - gen_effects: {}
  - ns3_eval: { sim_time: 40 }
