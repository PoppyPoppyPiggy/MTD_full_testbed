scenario: lpc-onoff-compare
desc: 동일 공격을 MTD off/on 두 번 돌려 결과 비교
defaults:
  role: gcs
  svc: mavlink
  atk_level: medium
  sim_time: 35
  mtd: off
  udp_probe: { count: 80, interval: 0.015 }
store:
  artifacts_dir: /tmp/MTD_bus
  reserve_bytes: 150000000
steps:
  # OFF
  - new_scn: { name: "onoff-off" }
  - pcap_start: {}
  - udp_probe: {}
  - attack: { name: mavlink_statustext_noise, level: high, duration_s: 18, pps: 60 }
  - attack: { name: gps_slow_spoof, level: medium, duration_s: 22 }
  - pcap_stop: {}
  - gen_effects: {}
  - ns3_eval: { sim_time: 35 }

  # ON
  - new_scn: { name: "onoff-on" }
  - pcap_start: {}
  - udp_probe: {}
  - mtd_apply: { loss_pct: 1.0, delay_ms: 2, jitter_ms: 1, dup_pct: 0.0 }
  - attack: { name: mavlink_statustext_noise, level: high, duration_s: 18, pps: 60 }
  - attack: { name: gps_slow_spoof, level: medium, duration_s: 22 }
  - mtd_revert: {}
  - pcap_stop: {}
  - gen_effects: {}
  - ns3_eval: { sim_time: 35 }
