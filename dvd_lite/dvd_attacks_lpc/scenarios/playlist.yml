# =================================================================
# DVD 시나리오 플레이리스트 v6.0 (Flexible Options)
# =================================================================
#
# 사용법:
#   python dvd_scenario_runner.py --scenario <시나리오명>
#
# 시나리오 카테고리:
#   [A] 빠른 테스트 (Quick Test) - 2~3개 공격, 5분 이내
#   [B] 카테고리별 (By Category) - 특정 공격 유형만
#   [C] 밸런스드 (Balanced) - 각 카테고리에서 선별
#   [D] 풀 스캔 (Full Scan) - 전체 26개 공격
#   [E] 랜덤 (Random) - 동적 빌더 사용
#
# =================================================================


# =================================================================
