# A1: 최소 테스트 (2개 공격) - 파이프라인 동작 확인용
quick_minimal:
  description: "[Quick] 최소 테스트 - GPS Spoofing + WiFi Deauth (2개)"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 10 }
    - { action: "http", endpoint: "stage/arm-and-takeoff", params: {alt: 10} }
    - { action: "sleep", sec: 15 }
    
    - { action: "attack", name: "gps-spoofing", duration_sec: 20, params: {use_seeker: false} }
    - { action: "sleep", sec: 3 }
    - { action: "attack", name: "wifi-deauth-attack", duration_sec: 20, params: {use_seeker: false} }
    
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "sleep", sec: 10 }

