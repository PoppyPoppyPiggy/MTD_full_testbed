# -----------------------------------------------------------------
# DVD 시나리오 자동화 플레이리스트 (v4 - Seeker/Orchestrator 분리)
#
# [수정됨]
# - CTI 수집용: 'action: attack' + 'params: {use_seeker: false}'
#   -> `attack_orchestrator.py start [name]` 호출 (단순 스크립트 실행)
#
# - MTD 평가용: 'action: attack' + 'params: {use_seeker: true}'
#   -> `rl/seeker.py` 호출 (RL 에이전트 실행)
# -----------------------------------------------------------------

# --- [A] CTI 수집용 시나리오 (MTD 없음, Seeker 비연동) ---
# 목적: ML 분류기 학습을 위한 "공격 원본 데이터" 수집
# MTD: Off
# Seeker: Off (use_seeker: false)

s1_cti_recon:
  description: "CTI 수집 (정찰): NO MTD, No Seeker"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "http", endpoint: "stage/arm-and-takeoff", params: {alt: 10} }
    - { action: "sleep", sec: 10 }
    - { action: "attack", name: "wifi_slow_scan", duration_sec: 45, params: {use_seeker: false} }
    - { action: "sleep", sec: 5 }
    - { action: "attack", name: "mavlink_param_poll", duration_sec: 45, params: {use_seeker: false} }
    - { action: "http", endpoint: "stage/return-to-land" }

s2_cti_lpc_dos:
  description: "CTI 수집 (LPC DoS): NO MTD, No Seeker"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 20 }
    - { action: "attack", name: "httpcam_slowloris", duration_sec: 60, params: {use_seeker: false, intensity: medium} }
    - { action: "sleep", sec: 10 }
    - { action: "attack", name: "rtsp_udp_trickle", duration_sec: 60, params: {use_seeker: false, intensity: high} }
    - { action: "http", endpoint: "stage/return-to-land" }

s3_cti_spoofing:
  description: "CTI 수집 (센서 스푸핑): NO MTD, No Seeker"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "http", endpoint: "stage/arm-and-takeoff", params: {alt: 15} }
    - { action: "sleep", sec: 20 }
    - { action: "attack", name: "attitude-spoofing", duration_sec: 45, params: {use_seeker: false} }
    - { action: "sleep", sec: 10 }
    - { action: "attack", name: "gps_slow_spoof", duration_sec: 60, params: {use_seeker: false} }
    - { action: "http", endpoint: "stage/return-to-land" }

# --- [B] MTD 평가용 시나리오 (MTD 활성화, Seeker 연동) ---
# 목적: MTD(Heuristic, RL)가 지능형 공격(Seeker)을 얼마나 잘 방어하는지 평가
# MTD: On
# Seeker: On (use_seeker: true)

s4_eval_heuristic_mtd:
  description: "MTD 평가 (Heuristic): Heuristic MTD vs RL Seeker"
  steps:
    - { action: "mtd_set", level: 2 } # Heuristic MTD 활성화
    - { action: "http", endpoint: "stage/boot" }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 15 }
    # ⭐️ name: "RL Seeker (Recon)" (설명용 이름, 실제론 policy가 행동 결정)
    # ⭐️ use_seeker: true -> rl/seeker.py를 실행
    - { action: "attack", name: "RL Seeker (Recon + GPS Spoof)", duration_sec: 120, params: {use_seeker: true, policy_path: "rl/models/seeker_policy.pth"} }
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "http", endpoint: "stage/post_analysis" }

s5_eval_rl_mtd:
  description: "MTD 평가 (RL): RL MTD vs RL Seeker (Full Kill Chain)"
  steps:
    - { action: "mtd_rl_enable", policy_path: "rl/models/defender_policy.pth" } # RL MTD 활성화
    - { action: "http", endpoint: "stage/boot" }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "B"} }
    - { action: "sleep", sec: 15 }
    # ⭐️ name: "RL Seeker (Full Kill Chain)" (설명용 이름)
    # ⭐️ use_seeker: true -> rl/seeker.py를 실행
    - { action: "attack", name: "RL Seeker (Full Kill Chain)", duration_sec: 180, params: {use_seeker: true, policy_path: "rl/models/seeker_policy.pth"} }
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "http", endpoint: "stage/post_analysis" }

s6_eval_no_mtd_vs_rl_seeker:
  description: "MTD 평가 (Baseline): NO MTD vs RL Seeker"
  steps:
    # MTD 설정 없음 (방어 없음)
    - { action: "http", endpoint: "stage/boot" }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 15 }
    # ⭐️ use_seeker: true -> rl/seeker.py를 실행
    - { action: "attack", name: "RL Seeker (Baseline)", duration_sec: 120, params: {use_seeker: true, policy_path: "rl/models/seeker_policy.pth"} }
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "http", endpoint: "stage/post_analysis" }

