# -----------------------------------------------------------------
# DVD 시나리오 자동화 플레이리스트 (v5.0 - CTI 데이터 수집 및 RL 평가)
# -----------------------------------------------------------------

# --- CTI 수집용 시나리오 (MTD Off, Seeker Off) ---
# 목적: 모든 공격 유형별 데이터를 수집하여 분류기 학습에 사용.
# 공격당 duration_sec: 30초 균일 할당 (정량적 데이터 확보)

s1_cti_recon_tampering:
  description: "CTI 수집 (정찰 & 기본 스푸핑) - 6 Attacks"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/arm-and-takeoff", params: {alt: 10} }
    - { action: "sleep", sec: 25 } # 고도 안정화 대기
    
    # Reconnaissance (4) + Tampering (2)
    - { action: "attack", name: "drone-discovery", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "companion-computer-discovery", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "ground-control-station-discovery", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "drone-gps-telemetry-detection", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "attitude-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "battery-spoofing", duration_sec: 30, params: {use_seeker: false} }
    
    - { action: "http", endpoint: "stage/return-to-land" }


s2_cti_adv_tampering_injection:
  description: "CTI 수집 (고급 스푸핑 & 명령 주입) - 6 Attacks"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 30 } # 자율비행 안정화 대기
    
    # Tampering (3) + Injection (3)
    - { action: "attack", name: "gps-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "critical-error-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "emergency-status-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "ground-control-station-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "camera-gimbal-takeover", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "gps-data-injection", duration_sec: 30, params: {use_seeker: false} }
    
    - { action: "http", endpoint: "stage/return-to-land" }


s3_cti_dos_injection:
  description: "CTI 수집 (DoS & 고급 주입) - 6 Attacks"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/arm-and-takeoff", params: {alt: 10} }
    - { action: "sleep", sec: 20 }
    
    # DoS (4) + Injection (2)
    - { action: "attack", name: "wifi-deauth-attack", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "geofencing-attack", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "gps-offset-glitching", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "denial-of-takeoff", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "return-to-home-point-override", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "waypoint-injection", duration_sec: 30, params: {use_seeker: false} }

    - { action: "http", endpoint: "stage/return-to-land" }


s4_cti_exfil_advanced:
  description: "CTI 수집 (정보 유출 & 기타 스푸핑) - 6 Attacks"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "B"} }
    - { action: "sleep", sec: 30 }
    
    # Exfiltration (3) + Others (3)
    - { action: "attack", name: "wifi-client-data-leak", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "flight-log-extraction", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "mission-extraction", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "vfr-hud-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "satellite-spoofing", duration_sec: 30, params: {use_seeker: false} }
    - { action: "attack", name: "communication-link-flooding", duration_sec: 30, params: {use_seeker: false} }

    - { action: "http", endpoint: "stage/return-to-land" }


s5_cti_normal:
  description: "CTI 수집 (정상 상태): NO MTD, No Seeker - Baseline"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/arm-and-takeoff", params: {alt: 10} }
    - { action: "sleep", sec: 30 }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 120 } # 긴 정상 비행 시간
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "sleep", sec: 15 }
    
    
# --- [B] MTD 평가용 시나리오 (Seeker 연동) - 기존과 동일하게 유지 ---
s6_eval_no_mtd_vs_rl_seeker:
  description: "MTD 평가 (Baseline): NO MTD vs RL Seeker"
  steps:
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 30 }
    - { action: "attack", name: "RL Seeker (Baseline)", duration_sec: 120, params: {use_seeker: true, policy_path: "rl/models/seeker_policy.pth"} }
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "http", endpoint: "stage/post_analysis" }

s4_eval_heuristic_mtd:
  description: "MTD 평가 (Heuristic): Heuristic MTD vs RL Seeker"
  steps:
    - { action: "mtd_set", level: 2 }
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "A"} }
    - { action: "sleep", sec: 30 }
    - { action: "attack", name: "RL Seeker (Heuristic)", duration_sec: 120, params: {use_seeker: true, policy_path: "rl/models/seeker_policy.pth"} }
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "http", endpoint: "stage/post_analysis" }

s5_eval_rl_mtd:
  description: "MTD 평가 (RL): RL MTD vs RL Seeker (Full Kill Chain)"
  steps:
    - { action: "mtd_rl_enable", policy_path: "rl/models/defender_policy.pth" }
    - { action: "http", endpoint: "stage/boot" }
    - { action: "sleep", sec: 15 }
    - { action: "http", endpoint: "stage/autopilot-flight", params: {route: "B"} }
    - { action: "sleep", sec: 30 }
    - { action: "attack", name: "RL Seeker (RL Defense)", duration_sec: 180, params: {use_seeker: true, policy_path: "rl/models/seeker_policy.pth"} }
    - { action: "http", endpoint: "stage/return-to-land" }
    - { action: "http", endpoint: "stage/post_analysis" }