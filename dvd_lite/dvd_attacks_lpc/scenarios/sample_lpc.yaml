profile: stealth
window: "09:00-18:00"
budget: 180
interval_ms: 20000
jitter_pct: 40
backoff: exp
rotate: roundrobin
phases_csv: "scenarios/options.d/mission_phases.csv"

targets:
  - 10.13.0.10:14550   # GCS
  - 10.13.0.20:5760    # FC
  - 10.13.0.30:3000    # Companion

actions:
  - module: modules/mavlink_param_drift.sh
    env:
      PARAM: "ATC_ANG_RLL_P"
      STEP: "0.01"
      NOISE: "0.02"
  - module: modules/telemetry_trickle_jam.sh
    env:
      INTENSITY: "low"
