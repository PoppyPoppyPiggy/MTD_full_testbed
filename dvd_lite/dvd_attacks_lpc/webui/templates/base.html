<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>DVD LPC WebUI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <!-- Plotly & Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  </head>
  <body>
    <header>
      <h1>DVD LPC Testbed — Live Dashboard</h1>
      <nav>
        <button id="refreshBtn">수동 새로고침</button>
        <label><input type="checkbox" id="autoRefresh" checked> 자동 새로고침(3s)</label>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      <small>attack_output 경로에서 파일을 읽어옵니다.</small>
    </footer>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
