<!doctype html>
<html><head>
  <meta charset="utf-8"/>
  <title>LPC Control</title>
  <style>
    body{max-width:1100px;margin:auto;font-family:system-ui,Arial}
    .card{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{padding:8px 12px;border-radius:8px;border:1px solid #aaa;background:#f5f5f5;cursor:pointer}
    a.btn{display:inline-block;padding:6px 10px;border:1px solid #aaa;border-radius:8px;text-decoration:none}
  </style>
</head><body>
  <h2>📡 LPC Control Panel</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<div class="card" style="background:#eef7ee">{{messages[0]}}</div>{% endif %}
  {% endwith %}

  <div class="card">
    <h3>1) 시나리오 실행 (YAML)</h3>
    <form method="post" action="/run_yaml">
      <div class="grid">
        <label>파일 선택
          <select name="yaml" style="width:100%">
            {% for y in yamls %}<option value="{{y}}">{{y}}</option>{% endfor %}
          </select>
        </label>
      </div>
      <button type="submit">실행</button>
      <a class="btn" href="/download/bus.log">bus.log 다운로드</a>
    </form>
  </div>

  <div class="card">
    <h3>2) ns‑3 평가</h3>
    <form method="post" action="/ns3_eval">
      <button type="submit">타임라인 생성 → ns‑3 실행</button>
      <span style="margin-left:8px">
        {% if files.timeline %}<a class="btn" href="/download/effect_timeline.csv">effect_timeline.csv</a>{% endif %}
        {% if files.metrics %}<a class="btn" href="/download/ns3_metrics.csv">ns3_metrics.csv</a>{% endif %}
      </span>
    </form>
  </div>
</body></html>
